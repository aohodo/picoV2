name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and checks
        run: python -m pip install --disable-pip-version-check -e . pytest==9.1.1 ruff==0.16.8

      - name: CLI smoke test
        run: python -m pico --help

      - name: Lint
        run: python -m ruff check pico tests scripts --output-format github

      - name: Test
        run: python -m pytest tests -q
