[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico"
version = "0.2.0"
description = "Human-inspired, evidence-driven transactional runtime for local coding agents"
requires-python = ">=3.10"
dependencies = [
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
lsp = [
  "multilspy==0.0.15",
]

[project.scripts]
pico = "pico.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
